name: Build OpenWrt 25.12.6 Xiaomi 4C (USB aktif + ZeroTier)

# Jalankan manual dari tab Actions > pilih workflow ini > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_TAG: v25.12.6

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout konfigurasi repository
        uses: actions/checkout@v4

      - name: Bebaskan ruang disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Pasang dependensi build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Ambil kode sumber OpenWrt
        run: git clone --depth 1 --branch "$OPENWRT_TAG" https://github.com/openwrt/openwrt.git

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Aktifkan EHCI dan OHCI di DTS 4C
        run: bash scripts/enable-usb-dts.sh openwrt

      - name: Susun konfigurasi
        run: |
          cp config/xiaomi-mi-router-4c.config openwrt/.config
          make -C openwrt defconfig

      - name: Periksa konfigurasi
        run: bash scripts/validate-config.sh openwrt/.config

      - name: Unduh sumber paket
        working-directory: openwrt
        run: make download -j8

      - name: Build firmware
        working-directory: openwrt
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Kumpulkan hasil
        working-directory: openwrt
        run: |
          mkdir -p ../hasil
          cp bin/targets/ramips/mt76x8/*xiaomi_mi-router-4c*sysupgrade.bin ../hasil/
          cp bin/targets/ramips/mt76x8/sha256sums ../hasil/ || true
          cp .config ../hasil/config.txt
          git diff -- target/linux/ramips/dts > ../hasil/usb-4c.patch || true
          ls -lh ../hasil

      - name: Unggah hasil
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-4c-usb
          path: hasil/

      - name: Buat release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="4c-zerotier-${{ github.run_number }}"
          gh release create "$TAG" hasil/* --repo "$GITHUB_REPOSITORY" --title "OpenWrt 25.12.6 Xiaomi 4C ZeroTier #${{ github.run_number }}" --notes "OpenWrt 25.12.6, USB host EHCI/OHCI diaktifkan, kmod-tun dan zerotier. Port USB fisik perlu dipasang dan diuji terpisah."
