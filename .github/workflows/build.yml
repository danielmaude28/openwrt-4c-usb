name: Build OpenWrt 25.12.6 Xiaomi 4C (USB aktif + ZeroTier)

# Setiap perubahan yang masuk main akan membangun firmware dan memperbarui
# GitHub Release "latest". Build manual tetap tersedia untuk pengujian branch.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_TAG: v25.12.6

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout konfigurasi repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Bebaskan ruang disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Pasang dependensi build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Ambil kode sumber OpenWrt
        run: git clone --depth 1 --branch "$OPENWRT_TAG" https://github.com/openwrt/openwrt.git

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Aktifkan EHCI dan OHCI di DTS 4C
        run: bash scripts/enable-usb-dts.sh openwrt

      - name: Susun konfigurasi
        run: |
          cp config/xiaomi-mi-router-4c.config openwrt/.config
          make -C openwrt defconfig

      - name: Periksa konfigurasi
        run: bash scripts/validate-config.sh openwrt/.config

      - name: Unduh sumber paket
        working-directory: openwrt
        run: make download -j8

      - name: Build firmware
        working-directory: openwrt
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Kumpulkan hasil
        working-directory: openwrt
        run: |
          mkdir -p ../hasil
          cp bin/targets/ramips/mt76x8/*xiaomi_mi-router-4c*sysupgrade.bin ../hasil/
          cp bin/targets/ramips/mt76x8/sha256sums ../hasil/ || true
          cp .config ../hasil/config.txt
          git diff -- target/linux/ramips/dts > ../hasil/usb-4c.patch || true
          ls -lh ../hasil

      - name: Unggah hasil build sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-4c-usb-${{ github.run_number }}
          path: hasil/

      - name: Perbarui GitHub Release latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest"
          TITLE="OpenWrt 25.12.6 Xiaomi 4C USB + ZeroTier (Latest)"
          NOTES="Build otomatis dari main pada commit ${GITHUB_SHA}. USB host EHCI/OHCI diaktifkan dan paket TUN/ZeroTier disertakan. Firmware telah dilaporkan berjalan pada perangkat; port USB fisik masih menunggu pemasangan dan pengujian hardware. Periksa checksum dan pastikan target perangkat benar sebelum flashing."

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --latest
            gh release upload "$TAG" hasil/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" hasil/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --latest
          fi
