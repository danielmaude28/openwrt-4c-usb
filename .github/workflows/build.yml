name: Build OpenWrt 25.12.6 Xiaomi 4C (USB aktif)

# Jalankan manual dari tab Actions > pilih workflow ini > Run workflow.
on:
  workflow_dispatch:

env:
  OPENWRT_TAG: v25.12.6

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Bebaskan ruang disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Pasang dependensi build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Ambil kode sumber OpenWrt
        run: git clone --depth 1 --branch "$OPENWRT_TAG" https://github.com/openwrt/openwrt.git

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Aktifkan EHCI dan OHCI di DTS 4C
        working-directory: openwrt
        run: |
          DTS=target/linux/ramips/dts/mt7628an_xiaomi_mi-router-4c.dts
          if [ ! -f "$DTS" ]; then
            echo "File DTS tidak ditemukan. File 4c yang ada:"
            ls target/linux/ramips/dts | grep -i 4c || true
            exit 1
          fi
          echo "--- sebelum ---"
          grep -n -B1 -A3 -E '&(ehci|ohci)' "$DTS" || echo "(belum ada blok ehci/ohci)"
          for n in ehci ohci; do
            if grep -q "&$n" "$DTS"; then
              sed -i "/&$n {/,/};/ s/status = \"disabled\"/status = \"okay\"/" "$DTS"
            else
              printf '\n&%s {\n\tstatus = "okay";\n};\n' "$n" >> "$DTS"
            fi
          done
          echo "--- sesudah ---"
          grep -n -B1 -A3 -E '&(ehci|ohci)' "$DTS"

      - name: Susun konfigurasi
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt76x8=y
          CONFIG_TARGET_ramips_mt76x8_DEVICE_xiaomi_mi-router-4c=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-app-sqm=y
          CONFIG_PACKAGE_sqm-scripts=y
          CONFIG_PACKAGE_kmod-sched-cake=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-nlbwmon=y
          CONFIG_PACKAGE_iftop=y
          CONFIG_PACKAGE_conntrack=y
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_usbutils=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_blkid=y
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          EOF
          make defconfig

      - name: Periksa konfigurasi
        working-directory: openwrt
        run: |
          if ! grep -q 'DEVICE_xiaomi_mi-router-4c=y' .config; then
            echo "Profil perangkat 4C tidak terpilih. Nama yang ada di mt76x8.mk:"
            grep -o 'xiaomi_mi[a-z0-9_-]*4c' target/linux/ramips/image/mt76x8.mk | sort -u
            exit 1
          fi
          for p in kmod-usb-core kmod-usb2 kmod-usb-ohci kmod-usb-storage sqm-scripts luci; do
            grep -q "^CONFIG_PACKAGE_$p=y" .config || { echo "WAJIB ADA tapi hilang: $p"; exit 1; }
          done
          for p in luci-app-sqm luci-app-ttyd luci-app-nlbwmon iftop conntrack htop nano curl usbutils block-mount kmod-fs-ext4; do
            grep -q "^CONFIG_PACKAGE_$p=y" .config || echo "PERINGATAN: tidak terpilih: $p"
          done

      - name: Unduh sumber paket
        working-directory: openwrt
        run: make download -j8

      - name: Build firmware
        working-directory: openwrt
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Kumpulkan hasil
        working-directory: openwrt
        run: |
          mkdir -p ../hasil
          cp bin/targets/ramips/mt76x8/*xiaomi_mi-router-4c*sysupgrade.bin ../hasil/
          cp bin/targets/ramips/mt76x8/sha256sums ../hasil/ || true
          cp .config ../hasil/config.txt
          git diff -- target/linux/ramips/dts > ../hasil/usb-4c.patch || true
          ls -lh ../hasil

      - name: Unggah hasil
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-4c-usb
          path: hasil/
